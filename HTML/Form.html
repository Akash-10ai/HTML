<!-- Html code to build form for taking various input -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM</title>
</head>
<body>
    <header></header>
    <main>
        <h4>Registration <Form></Form></h4>
        <form action="/action.php">
            <input type="text" placeholder="User name">
            <br><br>
            <input type="password" placeholder="password">
            <br><br>
            <h5>Select you class</h5>
            <br>
            <label for="101">
            <input type="radio" value = "Class X" name="Class" id="101">Class XI
            </label>
            <br><br>
            <label for="102">
            <input type="radio" value = "Class XII" name="Class" id="102">Class XII
            </label>
            <br><br>
            <br><br>
            <h5>Select your subject</h5>
            <br><br>
            <label for="math">
                <input type="checkbox" value="math" name="subject" id="101">Math
            </label>
            <br><br>
              <label for="physics">
                <input type="checkbox" value="physics" name="subject" id="102">Physics
            </label>
            <br><br>
              <label for="chemistry">
                <input type="checkbox" value="chemistry" name="subject" id="103">Chemistry
            </label>
            <br><br>
              <label for="biology">
                <input type="checkbox" value="biology" name="subject" id="104">Biology
            </label>
            <br>
            <br>
            select your city
            <select name="city" id="101">
                <option value="Delhi">Delhi</option>
                 <option value="mumbai">Mumbai</option>
                  <option value="Banglore">Banglore</option>
            </select>
            <br>
            <br>
            <textarea name="feedback" id="101" placeholder="please give your feedbacks"></textarea>
            <br>
            <input type="submit" value="submit">
        </form>

    </main>
    <footer></footer>
</body>
</html>
